<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>모바일 맞고 프로토타입</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
      }
      body, html {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #121A15;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      #app {
        position: relative;
        width: 100%;
        height: 100%;
      }
      #game-container {
        width: 100%;
        height: 100%;
        display: block;
      }

      /* UI Overlay Layer – NOT flex space-between; two separate absolute panels */
      .ui-overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 10;
      }

      /* TOP panel: CPU bar + status banner stacked at top */
      .ui-top {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        padding: 10px 12px 0;
      }
      #btn-restart {
        position: absolute;
        top: 10px;
        right: 12px;
        z-index: 2;
        pointer-events: auto;
      }

      /* BOTTOM panel: player bar + action bar pinned at bottom */
      .ui-bottom {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding: 0 12px 8px;
      }

      /* Player Info Bars */
      .player-bar {
        pointer-events: auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: rgba(18, 26, 21, 0.9);
        backdrop-filter: blur(12px);
        padding: 6px 14px;
        border-radius: 16px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: #f8fafc;
        width: 100%;
        max-width: 480px;
      }
      .player-info {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .player-badge {
        background: #22C55E;
        color: #0F172A;
        font-size: 11px;
        font-weight: 700;
        padding: 2px 6px;
        border-radius: 6px;
      }
      .player-badge.cpu {
        background: #94A3B8;
        color: #0F172A;
      }
      .player-name {
        font-size: 13px;
        font-weight: 600;
      }
      .captured-summary {
        display: flex;
        gap: 6px;
        font-size: 12px;
      }
      .score-chip { color: #FCD34D; font-weight: 800; margin-left: 4px; }
      .tag {
        background: rgba(255, 255, 255, 0.08);
        padding: 2px 6px;
        border-radius: 6px;
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .tag b {
        color: #FCD34D;
      }

      /* Status Banner – compact, under CPU bar, NOT floating center */
      .status-banner {
        pointer-events: none;
        background: rgba(15, 23, 42, 0.78);
        backdrop-filter: blur(6px);
        color: #E2E8F0;
        padding: 4px 14px;
        border-radius: 14px;
        font-size: 12px;
        font-weight: 500;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.1);
        text-align: center;
        max-width: 300px;
        width: 100%;
      }

      /* Action controls */
      .action-bar {
        pointer-events: auto;
        display: flex;
        justify-content: center;
        gap: 8px;
        margin-top: 4px;
      }
      .btn {
        background: rgba(255, 255, 255, 0.14);
        color: #f1f5f9;
        border: none;
        padding: 5px 12px;
        border-radius: 12px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .btn:hover, .btn.active {
        background: #22C55E;
        color: #0F172A;
      }

      /* Choice Modal (When 2 matching cards on floor) */
      #choice-modal {
        display: none;
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(6px);
        z-index: 50;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .choice-dialog {
        background: #1E293B;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 20px;
        padding: 20px 24px;
        max-width: 360px;
        width: 100%;
        text-align: center;
        color: #ffffff;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      }
      .choice-title {
        font-size: 16px;
        font-weight: 700;
        margin-bottom: 6px;
      }
      .choice-subtitle {
        font-size: 13px;
        color: #94A3B8;
        margin-bottom: 16px;
      }
      .choice-cards {
        display: flex;
        justify-content: center;
        gap: 16px;
      }
      .choice-card-item {
        background: rgba(255, 255, 255, 0.08);
        border: 2px solid transparent;
        border-radius: 12px;
        padding: 10px 14px;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .choice-card-item:hover {
        border-color: #22C55E;
        background: rgba(34, 197, 94, 0.15);
        transform: translateY(-2px);
      }
      .choice-card-image {
        display: block;
        width: 64px;
        height: 104px;
        object-fit: contain;
        margin: 0 auto;
      }
      .choice-card-name {
        font-size: 13px;
        font-weight: 600;
        margin-top: 6px;
      }
      #go-stop-modal {
        display: none;
        position: absolute;
        inset: 0;
        z-index: 60;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.65);
        padding: 20px;
      }
      .go-stop-dialog {
        width: min(360px, 100%);
        padding: 24px;
        text-align: center;
        color: #fff;
        background: #1E293B;
        border: 1px solid rgba(255, 255, 255, .16);
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, .45);
      }
      .go-stop-dialog h2 { font-size: 20px; margin-bottom: 8px; }
      .go-stop-dialog p { color: #CBD5E1; margin-bottom: 18px; }
      .go-stop-actions { display: flex; gap: 10px; justify-content: center; }
      .go-stop-actions .btn { flex: 1; min-height: 42px; }
      #btn-go { background: #F59E0B; color: #111827; }
      #btn-stop { background: #22C55E; color: #052E16; }
      #capture-notice {
        position: absolute;
        left: 50%;
        bottom: 92px;
        z-index: 45;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        color: #fff;
        background: rgba(15, 23, 42, .94);
        border: 1px solid rgba(252, 211, 77, .55);
        border-radius: 12px;
        opacity: 0;
        transform: translate(-50%, 12px);
        pointer-events: none;
        transition: opacity .18s ease, transform .18s ease;
      }
      #capture-notice.visible { opacity: 1; transform: translate(-50%, 0); }
      #capture-notice img { width: 28px; height: 46px; object-fit: contain; }
      #capture-notice span { color: #FCD34D; font-size: 11px; }
      #capture-notice .score-hints { color: #86EFAC; font-size: 11px; font-weight: 700; }
      #result-modal {
        display: none;
        position: absolute;
        inset: 0;
        z-index: 70;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: rgba(0, 0, 0, .72);
      }
      #start-modal {
        display: none;
        position: absolute;
        inset: 0;
        z-index: 55;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: rgba(0, 0, 0, .38);
      }
      .start-dialog {
        width: min(360px, 100%);
        padding: 30px 24px;
        text-align: center;
        color: #fff;
        background: #17211B;
        border: 1px solid rgba(252, 211, 77, .45);
        border-radius: 22px;
        box-shadow: 0 14px 42px rgba(0, 0, 0, .55);
      }
      .start-dialog h1 { margin-bottom: 10px; font-size: 28px; }
      .start-dialog p { margin-bottom: 22px; color: #CBD5E1; }
      #btn-start { min-width: 180px; min-height: 46px; background: #22C55E; color: #052E16; }
      .result-dialog {
        width: min(390px, 100%);
        padding: 28px 24px;
        text-align: center;
        color: #fff;
        background: #17211B;
        border: 1px solid rgba(252, 211, 77, .5);
        border-radius: 22px;
        box-shadow: 0 14px 42px rgba(0, 0, 0, .6);
      }
      .result-dialog h2 { margin-bottom: 12px; font-size: 26px; }
      #result-message { color: #FCD34D; font-size: 18px; font-weight: 800; }
      #result-scores { margin: 12px 0 22px; font-size: 16px; color: #E2E8F0; }

      /* Loading Screen */
      #loading-screen {
        position: absolute;
        inset: 0;
        background: #121A15;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #ffffff;
        z-index: 100;
        transition: opacity 0.4s ease;
      }
      .spinner {
        width: 44px;
        height: 44px;
        border: 4px solid rgba(255, 255, 255, 0.15);
        border-top-color: #22C55E;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 16px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      @media (max-width: 600px) {
        .ui-top { padding: max(8px, env(safe-area-inset-top)) 8px 0; }
        .ui-bottom { padding: 0 8px max(8px, env(safe-area-inset-bottom)); }
        .player-bar { max-width: 100%; padding: 6px 9px; border-radius: 13px; }
        .player-info { gap: 5px; }
        .player-name { font-size: 11px; }
        .captured-summary { gap: 3px; font-size: 10px; }
        .tag { padding: 2px 4px; }
        .status-banner { font-size: 11px; max-width: min(300px, 92vw); }
        .btn { min-height: 36px; padding: 6px 14px; }
      }
      @media (orientation: landscape) and (max-height: 520px) {
        .ui-top { padding-top: 5px; }
        .ui-bottom { padding-bottom: 5px; }
        .status-banner { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <!-- Loading Overlay -->
      <div id="loading-screen">
        <div class="spinner"></div>
        <p>게임 리소스 초기화 중...</p>
      </div>

      <!-- In-Game UI Overlay -->
      <div class="ui-overlay">

        <!-- TOP PANEL: CPU bar + status banner -->
        <div class="ui-top">
          <button id="btn-restart" class="btn" type="button">재시작</button>
          <div class="player-bar">
            <div class="player-info">
              <span class="player-badge cpu">CPU</span>
              <span class="player-name">상대방</span>
            </div>
            <div class="captured-summary" id="cpu-captured-summary">
               <span class="score-chip">점수 <b id="cpu-score">0</b></span>
               <span class="tag">고 <b id="cpu-go">0</b></span>
               <span class="tag">배 <b id="cpu-multiplier">1배</b></span>
              <span class="tag">광 <b id="cpu-gwang">0</b></span>
              <span class="tag">열 <b id="cpu-animal">0</b></span>
              <span class="tag">띠 <b id="cpu-ribbon">0</b></span>
              <span class="tag">피 <b id="cpu-junk">0</b></span>
            </div>
          </div>
          <div class="status-banner" id="status-banner">
            게임을 준비하고 있습니다...
          </div>
        </div>

        <!-- BOTTOM PANEL: player bar + buttons -->
        <div class="ui-bottom">
          <div class="player-bar">
            <div class="player-info">
              <span class="player-badge">ME</span>
              <span class="player-name">나 (플레이어)</span>
            </div>
            <div class="captured-summary" id="player-captured-summary">
               <span class="score-chip">점수 <b id="player-score">0</b></span>
               <span class="tag">고 <b id="player-go">0</b></span>
               <span class="tag">배 <b id="player-multiplier">1배</b></span>
              <span class="tag">광 <b id="player-gwang">0</b></span>
              <span class="tag">열 <b id="player-animal">0</b></span>
              <span class="tag">띠 <b id="player-ribbon">0</b></span>
              <span class="tag">피 <b id="player-junk">0</b></span>
            </div>
          </div>
        </div>

      </div>

      <div id="start-modal">
        <div class="start-dialog">
          <h1>모바일 맞고</h1>
          <p>카드를 모아 먼저 점수를 올려보세요.</p>
          <button id="btn-start" class="btn">새 게임 시작</button>
        </div>
      </div>

      <!-- Choice Modal (2 cards match on floor) -->
      <div id="choice-modal">
        <div class="choice-dialog">
          <div class="choice-title">어느 패를 먹을까요?</div>
          <div class="choice-subtitle">바닥에 같은 월 패가 2장 있습니다. 획득할 패를 선택하세요.</div>
          <div class="choice-cards" id="choice-cards-container"></div>
        </div>
      </div>

      <div id="go-stop-modal">
        <div class="go-stop-dialog">
          <h2>GO / STOP</h2>
          <p>현재 점수 <strong id="go-stop-score">3점 · 0 GO</strong></p>
          <div class="go-stop-actions">
            <button id="btn-go" class="btn">GO · 계속</button>
            <button id="btn-stop" class="btn">STOP · 종료</button>
          </div>
        </div>
      </div>

      <div id="capture-notice"></div>
      <div id="result-modal">
        <div class="result-dialog">
          <h2>게임 종료</h2>
          <div id="result-message">게임이 종료되었습니다.</div>
          <div id="result-scores">나 0점 · CPU 0점</div>
          <button id="btn-result-restart" class="btn">다시 시작</button>
        </div>
      </div>

      <div id="game-container"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
